<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афиша Челябинска: 26.09 — 02.10</title>
    <style>
        :root {
            --primary: #004465;
            --accent: #c45c26;
            --bg: #ffffff;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: transparent; 
            height: auto; 
            overflow: visible; 
        }

        .afisha-widget {
            width: 100%;
            max-width: 100%;
            background: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            height: auto;
        }

        .widget-header {
            background: var(--primary);
            color: white;
            padding: 20px 16px;
        }
        .widget-header h2 { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.3; }
        .widget-header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }

        .days-nav {
            display: flex;
            background: var(--white);
            padding: 10px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            scrollbar-width: none;
        }
        .days-nav::-webkit-scrollbar { display: none; }

        .day-btn {
            flex: 0 0 52px;
            height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: #fff;
            transition: all 0.2s ease;
        }
        .day-btn .d-name { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .day-btn .d-num { font-size: 17px; font-weight: 800; color: var(--text-main); }
        
        .day-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .day-btn.active .d-name, .day-btn.active .d-num { color: white; }

        .events-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: auto;
            overflow: visible;
        }

        .event-card {
            background: var(--white);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        .event-card:hover { border-color: var(--primary); background: #fcfdfe; }

        .card-meta { display: flex; justify-content: space-between; align-items: center; }
        .event-cat { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 800; }
        .event-time { font-size: 12px; font-weight: 700; color: var(--primary); background: #eef6fb; padding: 2px 8px; border-radius: 4px; }
        
        .event-card h3 { font-size: 15px; color: var(--text-main); font-weight: 700; line-height: 1.3; }
        .event-loc { font-size: 12px; color: var(--text-muted); }

        .detail-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .detail-overlay.open { transform: translateX(0); }

        .detail-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; background: #fff; }
        .back-btn { background: #f1f5f9; border: none; border-radius: 8px; padding: 10px 15px; cursor: pointer; color: var(--primary); font-weight: 700; font-size: 13px; }

        .detail-content { padding: 24px; overflow-y: auto; flex: 1; }
        .detail-tag { color: var(--accent); font-weight: 800; font-size: 11px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .detail-content h2 { font-size: 20px; margin-bottom: 16px; color: var(--text-main); line-height: 1.3; }
        .detail-desc { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; white-space: pre-line; }
        
        .info-grid { display: flex; flex-direction: column; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 12px; }
        .info-item { font-size: 14px; color: var(--text-main); line-height: 1.4; }
        .info-item b { color: var(--text-muted); font-weight: 500; min-width: 75px; display: inline-block; }
        .detail-price { margin-top: 20px; font-size: 16px; font-weight: 800; color: var(--primary); background: #f0f7ff; padding: 15px; border-radius: 10px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div class="afisha-widget" id="widgetRoot">
        <header class="widget-header">
            <h2>Юбилей за ширмой, дрифт и барокко</h2>
            <p>Челябинск: 26 сентября — 2 октября</p>
        </header>

        <nav class="days-nav" id="daysNav"></nav>
        <div class="events-container" id="eventsList"></div>

        <div class="detail-overlay" id="detailOverlay">
            <div class="detail-header">
                <button class="back-btn" onclick="closeDetail()">← Назад к списку</button>
            </div>
            <div class="detail-content" id="detailContent"></div>
        </div>
    </div>

<script>

        { id: 2, date: '26.09', dayName: 'Сб', cat: 'Театр', name: 'Спектакль «Актеры» 12+', time: '18:00', loc: 'Театр кукол им. Вольховского', price: 'до 1200 руб.', age: '12+',

        { id: 3, date: '26.09', dayName: 'Сб', cat: 'Театр', name: '«Едят ли ведьмы своих внуков?» 12+', time: '19:00', loc: 'Пространство «Свободы», 2к4', price: '800 руб.', age: '12+',

          desc: 'Финальная медиация сезона на крыше восточной башни. Панорама Челябинска и мастер-класс по созданию гербария.' },
        { id: 10, date: '27.09', dayName: 'Вс', cat: 'Концерт', name: 'Фестиваль Башмета: Бах 16+', time: '18:00', loc: 'Зал им. Прокофьева', price: '1800–6000 руб.', age: '16+', 
          desc: 'Камерный ансамбль «Солисты Москвы» под управлением Юрия Башмета исполнит все шесть Бранденбургских концертов И. С. Баха.' },
        { id: 11, date: '27.09', dayName: 'Вс', cat: 'Театр', name: 'Комедия «Шесть блюд из одной курицы» 16+', time: '18:00', loc: 'Театр драмы им. Орлова', price: '350–3000 руб.', age: '16+', 
          desc: 'История о матери, пытающейся устроить личную жизнь взрослого сына через брачное агентство.' },

        // 28 СЕНТЯБРЯ (ПН)
        { id: 12, date: '28.09', dayName: 'Пн', cat: 'Концерт', name: 'Башмета: «Маленькие трагедии» 16+', time: '18:00', loc: 'Зал им. Прокофьева', price: '1800–6000 руб.', age: '16+', 
          desc: 'Второй день фестиваля. Программа ансамбля «Солисты Москвы» посвящена «Маленьким трагедиям» А. С. Пушкина.' },

        // 29 СЕНТЯБРЯ (ВТ)
        { id: 13, date: '29.09', dayName: 'Вт', cat: 'Театр', name: 'Спектакль «Актеры» 12+', time: '18:30', loc: 'Театр кукол', price: 'до 1200 руб.', age: '12+',

          desc: 'Сольный концерт артиста. Актуальные треки в жанре альтернативного хип-хопа.' },

        { id: 15, date: '30.09', dayName: 'Ср', cat: 'Детям', name: 'Посвящение в первоклассники 6+', time: '10:00', loc: 'Киноцентр «Импульс»', price: '300 руб.', age: '6+', 
          desc: 'Игровая сессия и просмотр тематического фильма для самых маленьких школьников.' },
        { id: 16, date: '30.09', dayName: 'Ср', cat: 'Театр', name: 'Спектакль «Актеры» 12+', time: '18:30', loc: 'Театр кукол', price: 'до 1200 руб.', age: '12+', 
          desc: 'Спектакль о преданности театральному искусству дореволюционной России.' },
        { id: 17, date: '30.09', dayName: 'Ср', cat: 'Экскурсия', name: 'Концерт-экскурсия в «Родине» 6+', time: '18:30', loc: 'Зал «Родина»', price: '600 руб.', age: '6+', 
          desc: 'Ирина Андреева расскажет об архитектуре и механике органа Hermann Eule. Доступ в закулисье и музыкальные фрагменты.' },

        // 01 ОКТЯБРЯ (ЧТ)
        { id: 21, date: '01.10', dayName: 'Чт', cat: 'Интерактив', name: 'Кофейный рейв 16+', time: '17:00', loc: '«Любапетя» (Свободы, 2, к. 5)', price: 'от 700 руб.', age: '16+', 
          desc: 'Альтернатива алкогольным тусовкам. Зажигательная музыка, новые знакомства и слепая дегустация дрип-кофе. Подарки лучшим дегустаторам.' },
        { id: 22, date: '01.10', dayName: 'Чт', cat: 'Театр', name: 'Спектакль «Гроза» 12+', time: '18:00', loc: 'Молодежный театр (Кирова, 116)', price: 'от 600 руб.', age: '12+', 
          desc: 'Режиссёр Дарья Догадова превращает пьесу Островского в ностальгическую притчу о метафизическом разрыве между земным и небесным. Город Калинов на выжженной земле и история Катерины-ангела.' },

        // 02 ОКТЯБРЯ (ПТ)
        { id: 18, date: '02.10', dayName: 'Пт', cat: 'Концерт', name: 'Диджей-шоу с симфоджаз-оркестром 6+', time: '19:00', loc: 'Детская филармония', price: '700–1300 руб.', age: '6+', 
          desc: 'Электронные ритмические петли и акустика струнной секции. В программе — обработки мировых поп-хитов и рок-баллад.' },
        { id: 19, date: '02.10', dayName: 'Пт', cat: 'Стендап', name: 'Сергей Орлов: программа «Звезда» 18+', time: '19:00', loc: 'Live Холл Таганай', price: '2500–7000 руб.', age: '18+', 
          desc: 'Сольный концерт одного из самых популярных комиков страны. Материал на основе бытовых наблюдений и историй из жизни в провинции.' },
        { id: 20, date: '02.10', dayName: 'Пт', cat: 'Юбилей', name: 'Премьера «1935. Ровесники» 16+', time: '19:35', loc: 'Театр кукол им. Вольховского', price: 'до 1200 руб.', age: '16+', 
          desc: 'Спектакль-концерт к 90-летию театра. Рефлексия над событиями года основания (1935) через биографии актеров и кукол.' }
    ];

    const weekSchedule = [
        { d: '26.09', n: 'Сб' }, { d: '27.09', n: 'Вс' }, { d: '28.09', n: 'Пн' },
        { d: '29.09', n: 'Вт' }, { d: '30.09', n: 'Ср' }, { d: '01.10', n: 'Чт' },
        { d: '02.10', n: 'Пт' }
    ];

    let activeDate = '26.09';

    function sendHeight() {
        setTimeout(() => {
            const height = document.getElementById('widgetRoot').offsetHeight;
            window.parent.postMessage({ frameHeight: height }, '*');
        }, 60);
    }

    function initNav() {
        const nav = document.getElementById('daysNav');
        weekSchedule.forEach(item => {
            const btn = document.createElement('div');
            btn.className = `day-btn ${item.d === activeDate ? 'active' : ''}`;
            btn.innerHTML = `<span class="d-name">${item.n}</span><span class="d-num">${item.d.split('.')[0]}</span>`;
            btn.onclick = () => {
                activeDate = item.d;
                document.querySelectorAll('.day-btn').forEach(b => 
                    b.classList.toggle('active', b.querySelector('.d-num').innerText === item.d.split('.')[0])
                );
                renderEvents();
            };
            nav.appendChild(btn);
        });
    }

    function renderEvents() {
        const container = document.getElementById('eventsList');
        const filtered = eventsData.filter(e => e.date === activeDate);
        filtered.sort((a, b) => a.time.localeCompare(b.time));

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">На этот день событий не запланировано.<br>Попробуйте другие даты!</div>`;
        } else {
            container.innerHTML = filtered.map(evt => `
                <div class="event-card" onclick="openDetail(${evt.id})">
                    <div class="card-meta">
                        <span class="event-cat">${evt.cat}</span>
                        <span class="event-time">${evt.time}</span>
                    </div>
                    <h3>${evt.name}</h3>
                    <div class="event-loc">📍 ${evt.loc}</div>
                </div>
            `).join('');
        }
        sendHeight();
    }

    window.openDetail = function(id) {
        const evt = eventsData.find(e => e.id === id);
        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <span class="detail-tag">${evt.cat} | ${evt.age}</span>
            <h2>${evt.name}</h2>
            <div class="detail-desc">${evt.desc}</div>
            <div class="info-grid">
                <div class="info-item"><b>Когда:</b> ${evt.date} (${evt.dayName}) в ${evt.time}</div>
                <div class="info-item"><b>Где:</b> ${evt.loc}</div>
            </div>
            <div class="detail-price">Билеты: ${evt.price}</div>
        `;
        document.getElementById('detailOverlay').classList.add('open');
    };

    window.closeDetail = function() {
        document.getElementById('detailOverlay').classList.remove('open');
    };

    window.addEventListener('resize', sendHeight);
    initNav();
    renderEvents();
</script>

</body>
</html>
