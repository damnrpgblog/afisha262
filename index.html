<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афиша Челябинска: 26.09 — 02.10</title>
    <style>
        :root {
            --primary: #004465;
            --accent: #c45c26;
            --bg: #ffffff;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: transparent; 
            height: auto; 
            overflow: visible; 
        }

        .afisha-widget {
            width: 100%;
            max-width: 100%;
            background: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            height: auto;
        }

        .widget-header {
            background: var(--primary);
            color: white;
            padding: 20px 16px;
        }
        .widget-header h2 { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.3; }
        .widget-header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }

        .days-nav {
            display: flex;
            background: var(--white);
            padding: 10px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            scrollbar-width: none;
        }
        .days-nav::-webkit-scrollbar { display: none; }

        .day-btn {
            flex: 0 0 52px;
            height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: #fff;
            transition: all 0.2s ease;
        }
        .day-btn .d-name { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .day-btn .d-num { font-size: 17px; font-weight: 800; color: var(--text-main); }
        
        .day-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .day-btn.active .d-name, .day-btn.active .d-num { color: white; }

        .events-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: auto;
            overflow: visible;
        }

        .event-card {
            background: var(--white);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        .event-card:hover { border-color: var(--primary); background: #fcfdfe; }

        .card-meta { display: flex; justify-content: space-between; align-items: center; }
        .event-cat { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 800; }
        .event-time { font-size: 12px; font-weight: 700; color: var(--primary); background: #eef6fb; padding: 2px 8px; border-radius: 4px; }
        
        .event-card h3 { font-size: 15px; color: var(--text-main); font-weight: 700; line-height: 1.3; }
        .event-loc { font-size: 12px; color: var(--text-muted); }

        /* Окно подробностей */
        .detail-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .detail-overlay.open { transform: translateX(0); }

        .detail-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; background: #fff; }
        .back-btn { background: #f1f5f9; border: none; border-radius: 8px; padding: 10px 15px; cursor: pointer; color: var(--primary); font-weight: 700; font-size: 13px; }

        .detail-content { padding: 24px; overflow-y: auto; flex: 1; }
        .detail-tag { color: var(--accent); font-weight: 800; font-size: 11px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .detail-content h2 { font-size: 20px; margin-bottom: 16px; color: var(--text-main); line-height: 1.3; }
        .detail-desc { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; white-space: pre-line; }
        
        .info-grid { display: flex; flex-direction: column; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 12px; }
        .info-item { font-size: 14px; color: var(--text-main); line-height: 1.4; }
        .info-item b { color: var(--text-muted); font-weight: 500; min-width: 60px; display: inline-block; }
        .detail-price { margin-top: 20px; font-size: 16px; font-weight: 800; color: var(--primary); background: #f0f7ff; padding: 15px; border-radius: 10px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div class="afisha-widget" id="widgetRoot">
        <header class="widget-header">
            <h2>Юбилей за ширмой, дрифт и барокко</h2>
            <p>Челябинск: 26 сентября — 2 октября</p>
        </header>

        <nav class="days-nav" id="daysNav"></nav>
        <div class="events-container" id="eventsList"></div>

        <div class="detail-overlay" id="detailOverlay">
            <div class="detail-header">
                <button class="back-btn" onclick="closeDetail()">← Назад к списку</button>
            </div>
            <div class="detail-content" id="detailContent"></div>
        </div>
    </div>

<script>
    const eventsData = [
        // 26 СЕНТЯБРЯ
        { id: 1, date: '26.09', dayName: 'Сб', cat: 'Фестиваль', name: '«Культурный код. Челябинск»', time: '10:00', loc: 'ТРК «Горки» (ул. Артиллерийская, 136)', price: 'Вход свободный', age: '0+', 
          desc: 'В ТРК «Горки» пройдет мультиформатный фестиваль. На площадке объединят всероссийский чемпионат по брейк-дансу «БРЕЙК СОЮЗ 2026», в котором примут участие более 300 танцоров, и выставку электромобилей Evolute Day. Также в программе — итоговая фотовыставка финалистов регионального проекта.' },
        { id: 2, date: '26.09', dayName: 'Сб', cat: 'Театр', name: 'Спектакль «Актеры»', time: '18:00', loc: 'Театр кукол им. Вольховского (ул. Кирова, 8)', price: 'до 1200 руб.', age: '12+', 
          desc: 'Спектакль по мотивам книги основателя театра Павла Гарянова. Постановка посвящена труженикам провинциальных театров начала XX века — артистам дореволюционной России, среди которых не было звезд, но была беззаветная преданность делу.' },
        { id: 3, date: '26.09', dayName: 'Сб', cat: 'Театр', name: '«Едят ли ведьмы своих внуков?»', time: '19:00', loc: 'Театр «Свободы» (ул. Свободы, 2к4)', price: '800 руб.', age: '12+', 
          desc: '«Страшная комедия» исследует детские страхи и взаимоотношения поколений в декорациях мрачной сказки. Спектакль о том, как воображение ребенка сталкивается с реальностью взрослых.' },
        { id: 4, date: '26.09', dayName: 'Сб', cat: 'Стендап', name: 'Стендап Урал Тур: Зубарев и Дыба', time: '19:00', loc: 'пр. Ленина, 66 А', price: '1100–1700 руб.', age: '18+', 
          desc: 'Два сольных концерта по цене одного. Михаил Зубарев (Ростов-на-Дону) — победитель ВК Money Mic, финалист Открытого микрофона на ТНТ. Ваня Дыба — калужский комик, мастер импровизации со зрителем, разогревающий комик в турах Ильи Соболева.' },

        // 27 СЕНТЯБРЯ
        { id: 5, date: '27.09', dayName: 'Вс', cat: 'Театр', name: 'Спектакль «Актеры» (Дневной)', time: '11:00', loc: 'Театр кукол им. Вольховского', price: 'до 1200 руб.', age: '12+', 
          desc: 'Повторный показ спектакля-посвящения провинциальным артистам начала XX века.' },
        { id: 6, date: '27.09', dayName: 'Вс', cat: 'Балет', name: 'Фильм-балет «Равель»', time: '15:00', loc: 'Киномакс-Урал', price: '500 руб.', age: '16+', 
          desc: 'Показ фильма-балета «Равель: балеты Шеркауи и Вербрюггена». Зрители увидят современные хореографические интерпретации произведений «Картинки с выставки» и «Моя Матушка-Гусыня».' },
        { id: 7, date: '27.09', dayName: 'Вс', cat: 'Спорт', name: 'Презентация БК «Челбаскет»', time: '16:00', loc: 'Отель «Малахит» (ул. Труда, 153)', price: '300–1000 руб.', age: '6+', 
          desc: 'Официальная презентация обновленной команды перед стартом сезона в Суперлиге. В программе — показ новой формы, презентация проморолика и встреча с руководством клуба.' },
        { id: 8, date: '27.09', dayName: 'Вс', cat: 'Спорт', name: 'Финал Уральской лиги дрифта (ULD)', time: '16:30', loc: 'Трасса 74 (ул. Северный Луч, 2д)', price: '1600–3200 руб.', age: '0+', 
          desc: 'Финальный этап ULD 2026. В программе — квалификационные заезды, парные дуэли, выставка эксклюзивных автомобилей и автограф-сессия с пилотами. Работает прокат картинга и дрифт-такси.' },
        { id: 9, date: '27.09', dayName: 'Вс', cat: 'Экскурсия', name: 'Прогулка по крыше. Чувства города', time: '17:00', loc: 'Гос. исторический музей (ул. Труда, 100)', price: '300 руб.', age: '12+', 
          desc: 'Финальная в сезоне авторская экскурсия-медиация на крыше восточной башни музея. Участникам предложат изучить панораму Челябинска в формате замедления, а завершится встреча мастер-классом по созданию гербария.' },
        { id: 10, date: '27.09', dayName: 'Вс', cat: 'Концерт', name: 'Фестиваль Башмета: Бах', time: '18:00', loc: 'Зал им. Прокофьева (ул. Труда, 92а)', price: '1800–6000 руб.', age: '16+', 
          desc: 'В рамках IX Международного музыкального фестиваля Юрия Башмета выступит ансамбль «Солисты Москвы». В программе — все шесть Бранденбургских концертов И. С. Баха под управлением маэстро.' },
        { id: 11, date: '27.09', dayName: 'Вс', cat: 'Театр', name: 'Комедия «Шесть блюд из одной курицы»', time: '18:00', loc: 'Театр драмы им. Орлова', price: '350–3000 руб.', age: '16+', 
          desc: 'Сюжет строится вокруг классического конфликта матери, пытающейся устроить личную жизнь взрослого сына через брачное агентство, и не оправдавших надежд невест.' },

        // 28 СЕНТЯБРЯ
        { id: 12, date: '28.09', dayName: 'Пн', cat: 'Концерт', name: 'Башмет: «Маленькие трагедии»', time: '18:00', loc: 'Зал им. Прокофьева', price: '1800–6000 руб.', age: '16+', 
          desc: 'Второй вечер фестиваля Юрия Башмета. Программа камерного ансамбля «Солисты Москвы» будет посвящена «Маленьким трагедиям» А. С. Пушкина.' },

        // 29 СЕНТЯБРЯ
        { id: 13, date: '29.09', dayName: 'Вт', cat: 'Театр', name: 'Спектакль «Актеры»', time: '18:30', loc: 'Театр кукол им. Вольховского', price: 'до 1200 руб.', age: '12+', 
          desc: 'Вечерний показ постановки о провинциальных артистах дореволюционной России.' },
        { id: 14, date: '29.09', dayName: 'Вт', cat: 'Концерт', name: 'Данила Кашин (DK)', time: '19:00', loc: 'РК «Галактика развлечений»', price: '2300–9000 руб.', age: '16+', 
          desc: 'Большой сольный концерт Данилы Кашина. Артист исполнит актуальные треки в жанре альтернативного хип-хопа.' },

        // 30 СЕНТЯБРЯ
        { id: 15, date: '30.09', dayName: 'Ср', cat: 'Детям', name: 'Посвящение в первоклассники', time: '10:00', loc: 'Киноцентр «Импульс» (ул. 50-летия ВЛКСМ, 16)', price: '300 руб.', age: '6+', 
          desc: 'Мероприятие для самых юных школьников. В программе запланированы игровая сессия и просмотр тематического фильма.' },
        { id: 16, date: '30.09', dayName: 'Ср', cat: 'Театр', name: 'Спектакль «Актеры»', time: '18:30', loc: 'Театр кукол им. Вольховского', price: 'до 1200 руб.', age: '12+', 
          desc: 'Финальный показ спектакля о жизни тружеников провинциальных театров.' },
        { id: 17, date: '30.09', dayName: 'Ср', cat: 'Экскурсия', name: 'Концерт-экскурсия «Родина»', time: '18:30', loc: 'Зал «Родина» (ул. Кирова, 78)', price: '600 руб.', age: '6+', 
          desc: 'Директор зала Ирина Андреева расскажет об архитектуре здания и механике органа Hermann Eule, дополнив лекцию музыкальными фрагментами и доступом в закулисье.' },

        // 02 ОКТЯБРЯ
        { id: 18, date: '02.10', dayName: 'Пт', cat: 'Концерт', name: 'Диджей-шоу с симфоджаз-оркестром', time: '19:00', loc: 'Детская филармония (ул. Ворошилова, 6)', price: '700–1300 руб.', age: '6+', 
          desc: 'Программа объединяет электронные ритмические петли и акустическое звучание струнной и духовой секций. В списке композиций — обработки мировых поп-хитов и рок-баллад.' },
        { id: 19, date: '02.10', dayName: 'Пт', cat: 'Стендап', name: 'Сергей Орлов: программа «Звезда»', time: '19:00', loc: 'Концерт-холл «Таганай» (ул. Труда, 181)', price: '2500–7000 руб.', age: '18+', 
          desc: 'Выступление популярного комика Сергея Орлова. Артист представит материал, основанный на бытовых наблюдениях и историях из жизни в провинции.' },
        { id: 20, date: '02.10', dayName: 'Пт', cat: 'Юбилей', name: 'Премьера «1935. Ровесники»', time: '19:35', loc: 'Театр кукол им. Вольховского', price: 'до 1200 руб.', age: '16+', 
          desc: 'Спектакль-концерт к 90-летию театра. Постановка рефлексирует над событиями года основания театра (1935), связывая историю страны с биографиями актеров и кукол.' }
    ];

    const weekSchedule = [
        { d: '26.09', n: 'Сб' }, { d: '27.09', n: 'Вс' }, { d: '28.09', n: 'Пн' },
        { d: '29.09', n: 'Вт' }, { d: '30.09', n: 'Ср' }, { d: '01.10', n: 'Чт' },
        { d: '02.10', n: 'Пт' }
    ];

    let activeDate = '26.09';

    function sendHeight() {
        setTimeout(() => {
            const height = document.getElementById('widgetRoot').offsetHeight;
            window.parent.postMessage({ frameHeight: height }, '*');
        }, 50);
    }

    function initNav() {
        const nav = document.getElementById('daysNav');
        weekSchedule.forEach(item => {
            const btn = document.createElement('div');
            btn.className = `day-btn ${item.d === activeDate ? 'active' : ''}`;
            btn.innerHTML = `<span class="d-name">${item.n}</span><span class="d-num">${item.d.split('.')[0]}</span>`;
            btn.onclick = () => {
                activeDate = item.d;
                document.querySelectorAll('.day-btn').forEach(b => 
                    b.classList.toggle('active', b.querySelector('.d-num').innerText === item.d.split('.')[0])
                );
                renderEvents();
            };
            nav.appendChild(btn);
        });
    }

    function renderEvents() {
        const container = document.getElementById('eventsList');
        const filtered = eventsData.filter(e => e.date === activeDate);
        filtered.sort((a, b) => a.time.localeCompare(b.time));

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">На этот день событий не запланировано.<br>Попробуйте другие даты!</div>`;
        } else {
            container.innerHTML = filtered.map(evt => `
                <div class="event-card" onclick="openDetail(${evt.id})">
                    <div class="card-meta">
                        <span class="event-cat">${evt.cat}</span>
                        <span class="event-time">${evt.time}</span>
                    </div>
                    <h3>${evt.name}</h3>
                    <div class="event-loc">📍 ${evt.loc}</div>
                </div>
            `).join('');
        }
        sendHeight();
    }

    window.openDetail = function(id) {
        const evt = eventsData.find(e => e.id === id);
        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <span class="detail-tag">${evt.cat} | ${evt.age}</span>
            <h2>${evt.name}</h2>
            <p class="detail-desc">${evt.desc}</p>
            <div class="info-grid">
                <div class="info-item"><b>Когда:</b> ${evt.date} (${evt.dayName}) в ${evt.time}</div>
                <div class="info-item"><b>Где:</b> ${evt.loc}</div>
            </div>
            <div class="detail-price">Билеты: ${evt.price}</div>
        `;
        document.getElementById('detailOverlay').classList.add('open');
        // При открытии фиксированного окна родителю высоту менять не нужно, 
        // окно перекрывает текущий вьюпорт фрейма.
    };

    window.closeDetail = function() {
        document.getElementById('detailOverlay').classList.remove('open');
    };

    window.addEventListener('resize', sendHeight);

    initNav();
    renderEvents();
</script>

</body>
</html>
